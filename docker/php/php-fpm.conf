; php-fpm im Container, ohne root: lauscht im Netz von WSL (network_mode: host) auf 127.0.0.1:${FPM_PORT}, nginx reicht dorthin weiter
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:${FPM_PORT}
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Umgebung des Containers an PHP weitergeben (TZ, HOME); Konfiguration der App kommt aus .env/.env.local
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
